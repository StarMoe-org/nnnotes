[package]
name = "nnnotes-deck"
# the nnnotes version (src/nnnotes/__init__.py); the wheel takes its version from here
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
description = "nnnotes._deck: the ournotes-sim chart statistics as a Python extension module"
license = "MIT"
publish = false

[lib]
name = "_deck"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
# The model source is pinned exactly. Publishing additionally requires replay/recommendation release engines
# from that same revision; .github/workflows/deck.yml tracks newer model releases.
ournotes-sim = { git = "https://github.com/empty-sekai/ournotes-deck", rev = "df86cc758e57da662582f9167752ce7ac68013e5" }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }

[profile.release]
lto = "thin"
codegen-units = 1
