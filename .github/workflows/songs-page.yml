name: Songs page (UI only)

on:
  workflow_dispatch:
    inputs:
      player_ref:
        description: Full lowercase 40-hex empty-sekai/ournotes-player UI commit
        type: string
        required: true
      dry_run:
        description: Validate the new UI and list ten uploads without writing objects
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Full prebuilt publication also writes songs/. Keep the two releases ordered.
  group: songs-page-publication
  cancel-in-progress: false

env:
  MUSIC_DATA_PUBLISH: ${{ vars.MUSIC_DATA_PUBLISH || 'false' }}
  STORY_S3_ENDPOINT: ${{ vars.STORY_S3_ENDPOINT || 'https://storage.bdon.moe' }}
  STORY_S3_BUCKET: ${{ vars.STORY_S3_BUCKET || 'moenotes' }}
  WORK: ${{ github.workspace }}/songs-ui-work

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: publisher
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate immutable UI commit input
        env:
          PLAYER_REF: ${{ inputs.player_ref }}
        run: python publisher/.github/scripts/songs_page_data.py --player-ref "$PLAYER_REF"
      - name: The exact new Player UI
        uses: actions/checkout@v7
        with:
          repository: empty-sekai/ournotes-player
          ref: ${{ inputs.player_ref }}
          path: player
      - name: Existing object-store client (no NN or Rust build)
        run: python -m pip install boto3
      - name: SHA-verified current formal inputs and separate UI pin metadata
        env:
          PLAYER_REF: ${{ inputs.player_ref }}
        run: |
          python publisher/.github/scripts/songs_page_data.py \
            --player-ref "$PLAYER_REF" --out "$WORK"
      - name: New consumer modules and actual shared WASM (three cases)
        run: |
          node publisher/.github/scripts/prebuilt_publish_smoke.mjs \
            "$GITHUB_WORKSPACE/player/examples/songs" "$WORK/data"
      - name: Validate the clean ten-file closure without credentials
        run: |
          python publisher/.github/scripts/prebuilt_publish_page.py \
            --publisher "$GITHUB_WORKSPACE/publisher/.github/scripts/music_data.py" \
            --page "$GITHUB_WORKSPACE/player/examples/songs" --bundle "$WORK/page-pin" --dry-run
      - name: Publish only songs files; HTML last, every object SHA-read-back checked
        env:
          STORY_S3_ACCESS_KEY: ${{ !inputs.dry_run && vars.MUSIC_DATA_PUBLISH == 'true' && secrets.STORY_S3_ACCESS_KEY || '' }}
          STORY_S3_SECRET_KEY: ${{ !inputs.dry_run && vars.MUSIC_DATA_PUBLISH == 'true' && secrets.STORY_S3_SECRET_KEY || '' }}
        run: |
          python publisher/.github/scripts/prebuilt_publish_page.py \
            --publisher "$GITHUB_WORKSPACE/publisher/.github/scripts/music_data.py" \
            --page "$GITHUB_WORKSPACE/player/examples/songs" --bundle "$WORK/page-pin" \
            ${{ (inputs.dry_run || vars.MUSIC_DATA_PUBLISH != 'true') && '--dry-run' || '' }}
      - name: Preserve UI/input identity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: songs-ui-report
          if-no-files-found: warn
          path: |
            ${{ env.WORK }}/data-check.json
            ${{ env.WORK }}/page-pin/prebuilt.json
