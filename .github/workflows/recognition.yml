name: Recognition gallery

# Keeps the screenshot recognition bundle of MoeNotes' card box current. A run takes the union of the Member and Snap
# cards of every enabled region's master data (moenotes-masterdata-sync), each card's artwork from the asset service
# (SHA-256 and size checked) and the pinned runtime and models (ONNX Runtime Web, the card locator, the Member and Snap
# encoders, field and rank readers, recognition-runtime.json), computes each card's reference embedding with the pinned
# encoder (ONNX Runtime on the CPU) and publishes everything content-addressed into the story site's bucket
# (assets/<sha256>.<ext>): dependencies first, then the gallery and model manifests, then the bundle manifest that lists
# them all, and last the small pointer recognition/current.json that names the bundle. Nothing is deleted or
# overwritten; a catalog that lacks a published card, or any artwork that fails its check, leaves the pointer where it is.
#
# Triggers: moenotes-masterdata-sync's repository_dispatch `masterdata-updated`, a schedule every six hours in case a
# dispatch was missed, and workflow_dispatch (force: build although the inputs are unchanged; dry_run). Master data moves
# before the asset service exports its artwork: the plan job waits for that export. Publishing switch: the repository
# variable RECOGNITION_PUBLISH (unset: every run is a dry run). docs: .github/RECOGNITION.md

on:
  repository_dispatch:
    types: [masterdata-updated]
  workflow_dispatch:
    inputs:
      force:
        description: "build and publish although the catalog, artwork and runtime pins are those of the published bundle"
        type: boolean
        default: false
      dry_run:
        description: "build and check, then list what would be uploaded instead of uploading"
        type: boolean
        default: false
  schedule:
    - cron: "53 */6 * * *"

permissions:
  contents: read

# One publisher at a time: a bundle may only advance the pointer from the bundle it was built on.
concurrency:
  group: recognition-gallery
  cancel-in-progress: false

env:
  STORY_S3_ENDPOINT: ${{ vars.STORY_S3_ENDPOINT || 'https://storage.bdon.moe' }}
  STORY_S3_BUCKET: ${{ vars.STORY_S3_BUCKET || 'moenotes' }}
  RECOGNITION_S3_PREFIX: ${{ vars.RECOGNITION_S3_PREFIX || '' }}
  RECOGNITION_REGIONS: ${{ vars.RECOGNITION_REGIONS || 'hk-tw-mo en kr jp' }}
  RECOGNITION_ASSET_API: ${{ vars.RECOGNITION_ASSET_API || 'https://assets.bdon.moe' }}
  MASTERDATA_BASE_URL: ${{ vars.MASTERDATA_BASE_URL || 'https://metadata.bdon.moe' }}
  # The publishing switch and this run's choice: anything but a publishing run gets no bucket key.
  RECOGNITION_WRITE: ${{ vars.RECOGNITION_PUBLISH == 'true' && github.event.inputs.dry_run != 'true' }}
  PYTHON_VERSION: "3.13"
  WORK: ${{ github.workspace }}/recognition-work

jobs:
  plan:
    runs-on: ubuntu-latest
    # up to an hour waiting for the asset service to export a new master version
    timeout-minutes: 75
    outputs:
      build: ${{ steps.plan.outputs.build }}
      runtime: ${{ steps.plan.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Catalog and artwork against the published bundle
        id: plan
        env:
          FORCE: ${{ github.event.inputs.force == 'true' }}
        run: python .github/scripts/recognition.py plan

  runtime:
    # Uploads the pinned files the bucket lacks (the first run, or after a pin changes) and hands the encoder models to
    # the build job; runs whenever a build follows or a pinned file is missing.
    needs: plan
    if: needs.plan.outputs.build == 'true' || needs.plan.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # draft release assets are visible to tokens with push access only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: S3 SDK
        run: python -m pip install --quiet boto3
      - name: Pinned files from the release, encoder models for the build
        env:
          GH_TOKEN: ${{ github.token }}
          STORY_S3_ACCESS_KEY: ${{ env.RECOGNITION_WRITE == 'true' && secrets.STORY_S3_ACCESS_KEY || '' }}
          STORY_S3_SECRET_KEY: ${{ env.RECOGNITION_WRITE == 'true' && secrets.STORY_S3_SECRET_KEY || '' }}
        run: >-
          python .github/scripts/recognition.py runtime --work "$WORK/runtime" --report "$WORK/reports/runtime.json"
          --stage "$WORK/models" ${{ env.RECOGNITION_WRITE != 'true' && '--dry-run' || '' }}
      - name: Encoder models for the build job
        if: needs.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: recognition-encoder-models
          if-no-files-found: error
          retention-days: 1
          path: ${{ env.WORK }}/models/
      - name: Preserve the report (public identities only)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recognition-runtime-report
          if-no-files-found: warn
          path: ${{ env.WORK }}/reports/

  build:
    needs: [plan, runtime]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.build == 'true' && needs.runtime.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Pinned gallery builder libraries
        run: |
          python -m pip install --quiet --only-binary=:all: boto3 pytest $(python .github/scripts/recognition.py requirements)
      - name: Self-test
        run: python -m pytest -q -p no:cacheprovider .github/scripts/test_recognition.py
      - name: Encoder models from the runtime job
        uses: actions/download-artifact@v8
        with:
          name: recognition-encoder-models
          path: ${{ env.WORK }}/models
      - name: Build
        env:
          RECOGNITION_EXPORT_WAIT: "0"   # the plan job waited; a master version newer than its catalog stops here
        run: python .github/scripts/recognition.py build "$WORK/out" --models "$WORK/models"
      - name: Publish
        # Read-only preflight first; a dry run (the dry_run input, or RECOGNITION_PUBLISH off) stops after it.
        env:
          STORY_S3_ACCESS_KEY: ${{ env.RECOGNITION_WRITE == 'true' && secrets.STORY_S3_ACCESS_KEY || '' }}
          STORY_S3_SECRET_KEY: ${{ env.RECOGNITION_WRITE == 'true' && secrets.STORY_S3_SECRET_KEY || '' }}
        run: python .github/scripts/recognition.py publish "$WORK/out" ${{ env.RECOGNITION_WRITE != 'true' && '--dry-run' || '' }}
      - name: Preserve the reports (public identities only, no artwork or embeddings)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recognition-reports
          if-no-files-found: warn
          path: |
            ${{ env.WORK }}/out/report.json
            ${{ env.WORK }}/out/publication.json
            ${{ env.WORK }}/out/failure.json
            ${{ env.WORK }}/out/site/recognition/current.json
