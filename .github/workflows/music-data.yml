name: Music data

# Every enabled region is checked independently. The reusable workflow pins a
# source snapshot, builds/checks the existing exporter and rechecks freshness
# before publication. Its publishing switch remains off unless explicitly set.
on:
  repository_dispatch:
    types: [masterdata-updated]
  workflow_dispatch:
    inputs:
      region:
        description: Region to check (all checks every enabled region)
        type: choice
        options: [all, hk-tw-mo, jp]
        default: all
      force:
        description: Build even when published inputs have not changed
        type: boolean
        default: false
      dry_run:
        description: Build and check without uploading objects
        type: boolean
        default: false
      reencode_only:
        description: Gzip the verified published JSON snapshot without rebuilding the model
        type: boolean
        default: false
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

jobs:
  regions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      regions: ${{ steps.regions.outputs.regions }}
      count: ${{ steps.regions.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: Regions to check
        id: regions
        env:
          MUSIC_DATA_REGIONS: ${{ vars.MUSIC_DATA_REGIONS || 'hk-tw-mo jp' }}
          REQUESTED_REGION: ${{ github.event.inputs.region }}
        run: python3 .github/scripts/music_data.py regions

  music:
    needs: regions
    if: needs.regions.outputs.count != '0' && github.event.inputs.reencode_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.regions) }}
    # The normal and prebuilt workflows serialize the same region's publication.
    concurrency:
      group: music-data-${{ matrix.region }}
      cancel-in-progress: false
    uses: ./.github/workflows/music-data-region.yml
    with:
      region: ${{ matrix.region }}
      force: ${{ github.event.inputs.force == 'true' }}
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    secrets: inherit

  reencode:
    needs: regions
    if: needs.regions.outputs.count != '0' && github.event.inputs.reencode_only == 'true'
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.regions.outputs.regions) }}
    concurrency:
      group: music-data-${{ matrix.region }}
      cancel-in-progress: false
    uses: ./.github/workflows/music-data-reencode-region.yml
    with:
      region: ${{ matrix.region }}
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    secrets: inherit
