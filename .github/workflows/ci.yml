name: CI

on:
  push:
    branches: [main]
  pull_request:
  # the Deck model workflow dispatches CI on the pull request it opens
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (builds the extension module nnnotes._deck)
        run: uv pip install --system -e ".[test]" boto3
      - name: Lint
        run: python -m pyflakes src tests
      - name: Command line
        run: python -m nnnotes --help
      - name: Test
        run: python -m pytest
      - uses: actions/setup-node@v7
        if: matrix.python-version == '3.13'
        with:
          node-version: "22"
      - name: Chart data page
        if: matrix.python-version == '3.13'
        env:
          PLAYER_REPOSITORY: ${{ vars.MUSIC_DATA_PLAYER_REPOSITORY || 'empty-sekai/ournotes-player' }}
          PLAYER_REF: ${{ vars.MUSIC_DATA_PLAYER_REF }}
        run: .github/scripts/songs_page.sh "$RUNNER_TEMP/music-data-player"
      - name: Workflow tests
        env:
          MUSIC_DATA_PAGE: ${{ matrix.python-version == '3.13' && format('{0}/music-data-player/examples/songs', runner.temp) || '' }}
        run: python -m pytest -q .github/scripts

  goldens:
    # The golden records of the stages (tests/golden/*.json) were made with these library versions; with the same
    # versions installed an output change without a stage or converter version bump fails instead of being skipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/goldens-constraints.txt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (pinned)
        run: uv pip install --system -c .github/goldens-constraints.txt -e ".[test]"
      - name: Golden records
        env:
          GOLDENS_STRICT: "1"
        run: python -m pytest tests/test_goldens.py tests/test_objexport.py

  rust:
    # the extension module's own code (rust/); ournotes-deck is tested in its repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format and lints
        working-directory: rust
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
