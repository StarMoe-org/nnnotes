name: Music data (one region)

on:
  workflow_call:
    inputs:
      region:
        type: string
        required: true
      force:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The story site's bucket (its repository variables) and the key prefix of the music data.
  STORY_S3_ENDPOINT: ${{ vars.STORY_S3_ENDPOINT || 'https://storage.bdon.moe' }}
  STORY_S3_BUCKET: ${{ vars.STORY_S3_BUCKET || 'moenotes' }}
  # The legacy region determines only ownership of its old prefix, never which matrix regions run.
  MUSIC_DATA_S3_PREFIX: ${{ inputs.region == 'jp' && (vars.MUSIC_DATA_JP_S3_PREFIX || (vars.MUSIC_DATA_MASTERDATA_REGION == 'jp' && vars.MUSIC_DATA_S3_PREFIX) || 'jp/music-data') || (vars.MUSIC_DATA_TW_S3_PREFIX || (vars.MUSIC_DATA_MASTERDATA_REGION != 'jp' && vars.MUSIC_DATA_S3_PREFIX) || 'music-data') }}
  MUSIC_DATA_TW_PREFIX_CHECK: ${{ vars.MUSIC_DATA_TW_S3_PREFIX || (vars.MUSIC_DATA_MASTERDATA_REGION != 'jp' && vars.MUSIC_DATA_S3_PREFIX) || 'music-data' }}
  MUSIC_DATA_JP_PREFIX_CHECK: ${{ vars.MUSIC_DATA_JP_S3_PREFIX || (vars.MUSIC_DATA_MASTERDATA_REGION == 'jp' && vars.MUSIC_DATA_S3_PREFIX) || 'jp/music-data' }}
  # The publishing switch: anything but 'true' makes every run a dry run.
  MUSIC_DATA_PUBLISH: ${{ vars.MUSIC_DATA_PUBLISH || 'false' }}
  # moenotes-masterdata-sync: decoded master data by region (index.json lists every file with its SHA-256).
  MASTERDATA_BASE_URL: ${{ vars.MASTERDATA_BASE_URL || 'https://metadata.bdon.moe' }}
  MASTERDATA_REGION: ${{ inputs.region }}
  # This consumer reads nominal chart-stats/3. Explicit overrides must support the same format; the page's modules
  # smoke-test the new format before master-data download and every completed artifact before publication.
  PLAYER_REPOSITORY: ${{ vars.MUSIC_DATA_PLAYER_REPOSITORY || 'empty-sekai/ournotes-player' }}
  PLAYER_REF: ${{ vars.MUSIC_DATA_PLAYER_REF || '44d31754f8b2ba0fe414eaf49586d375ecb3c0d0' }}
  PLAYFETCH_VERSION: ${{ vars.PLAYFETCH_VERSION || 'v0.92' }}
  APK_PACKAGE: ${{ inputs.region == 'jp' && 'com.bushiroad.sirius' || vars.STORY_APK_PACKAGE || 'com.bilibili.sirius' }}
  PYTHON_VERSION: "3.13"
  PYTHONPATH: src
  WORK: ${{ github.workspace }}/music-data-work
  # Completed native programs, under the model source identity and compiled semantic inputs. A change to a
  # chart, kind or shape only recomputes affected programs; current metadata and checks are assembled each run.
  # This contains derived numeric results, with no original game files or migration from whole-chart caches.
  MUSIC_DATA_STATS_CACHE: ${{ github.workspace }}/music-data-work/stats-cache
  # Bundle keys come from secrets; catalog versions and CDN roots come from the saved master snapshot.
  NNNOTES_CATALOG_REGION: ${{ inputs.region == 'jp' && 'jp' || 'tw' }}
  NNNOTES_CATALOG_LANGUAGE: ${{ inputs.region == 'jp' && 'ja' || 'zh-Hant' }}
  NNNOTES_SERVERS_JP_NAME: JP
  NNNOTES_SERVERS_JP_LANGUAGES: ja
  NNNOTES_SERVERS_TW_NAME: TW/HK/MO
  NNNOTES_SERVERS_TW_LANGUAGES: zh-Hans,zh-Hant,en,ko,ja

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the nnnotes commit: the last one that changed src/, rust/ or pyproject.toml
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Inputs against the published build
        id: plan
        env:
          FORCE: ${{ inputs.force }}
        run: python .github/scripts/music_data.py plan

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: APK
        env:
          PLAYFETCH_CREDENTIALS_JSON: ${{ secrets.PLAYFETCH_CREDENTIALS }}
        run: .github/scripts/apk.sh "$WORK/apk"
      - name: JP API network access
        if: inputs.region == 'jp'
        env:
          NNNOTES_PATHS_APK: ${{ env.WORK }}/apk/base.apk
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openvpn > /dev/null
          uv pip install --system --only-binary=:all: UnityPy numpy grpcio pycryptodome brotli
          python .github/scripts/jp_vpngate.py watch > "$RUNNER_TEMP/jp-vpngate-watch.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/jp-vpngate-watch-shell.pid"
          for i in $(seq 1 60); do
            if python .github/scripts/story_site.py jp-check; then break; fi
            sleep 2
          done
          python .github/scripts/story_site.py jp-check
      - name: JP CDN authentication preflight
        if: inputs.region == 'jp'
        env:
          NNNOTES_PATHS_APK: ${{ env.WORK }}/apk/base.apk
        run: python .github/scripts/music_data.py jp-check
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: The chart data page
        run: .github/scripts/songs_page.sh "$WORK/page"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install nnnotes
        # builds the extension module nnnotes._deck: the deck model at the commit rust/Cargo.toml pins
        run: uv pip install --system -e ".[test]" boto3

      - name: Gate self-test
        env:
          MUSIC_DATA_PAGE: ${{ env.WORK }}/page/examples/songs
        run: python -m pytest -q -p no:cacheprovider .github/scripts/test_music_data.py .github/scripts/test_jp_workflow.py .github/scripts/test_music_data_refresh.py .github/scripts/test_music_data_compression.py .github/scripts/test_jp_vpngate.py

      - name: Master data
        run: python .github/scripts/music_data.py master "$WORK/master"

      - name: Chart statistics of the last build
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.MUSIC_DATA_STATS_CACHE }}
          key: music-data-native-v1-${{ inputs.region }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: music-data-native-v1-${{ inputs.region }}-

      - name: Build
        env:
          NNNOTES_BUNDLE_KEY: ${{ secrets.NNNOTES_BUNDLE_KEY }}
          NNNOTES_BUNDLE_NONCE_SEED: ${{ secrets.NNNOTES_BUNDLE_NONCE_SEED }}
          # A new cache on every run, never actions/cache: nnnotes keeps a downloaded catalog file for good (a cached
          # one would never see a new resource version), and the cache holds decrypted game files.
          NNNOTES_PATHS_CACHE: ${{ env.WORK }}/cache
          NNNOTES_PATHS_MASTER: ${{ env.WORK }}/master
          NNNOTES_PATHS_APK: ${{ env.WORK }}/apk/base.apk
        run: |
          if [ "${{ inputs.region }}" = "jp" ]; then python .github/scripts/story_site.py jp-check; fi
          python .github/scripts/music_data.py build "$WORK/out"

      - name: Keep the chart statistics for the next build
        # Each completed native computation is saved atomically. Keep those checkpoints after a later
        # failure so the next run only computes missing units.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.MUSIC_DATA_STATS_CACHE }}
          key: music-data-native-v1-${{ inputs.region }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Gates
        id: gates
        run: python .github/scripts/music_data.py check "$WORK/out" "$WORK/master" "$WORK/page/examples/songs"

      - name: Publish
        # Only after every gate passed (a failed step skips it). A dry run (the dry_run input, or the publishing switch
        # MUSIC_DATA_PUBLISH off) lists what it would upload; it gets no bucket key: anonymous, it can only read.
        env:
          STORY_S3_ACCESS_KEY: ${{ !inputs.dry_run && vars.MUSIC_DATA_PUBLISH == 'true' && secrets.STORY_S3_ACCESS_KEY || '' }}
          STORY_S3_SECRET_KEY: ${{ !inputs.dry_run && vars.MUSIC_DATA_PUBLISH == 'true' && secrets.STORY_S3_SECRET_KEY || '' }}
          FORCE: ${{ inputs.force }}
        run: python .github/scripts/music_data.py publish "$WORK/out" ${{ (inputs.dry_run || vars.MUSIC_DATA_PUBLISH != 'true') && '--dry-run' || '' }}

      - name: Preserve gate reports (not game payloads or private snapshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: music-data-reports-${{ inputs.region }}
          if-no-files-found: warn
          path: |
            ${{ env.WORK }}/out/check.json
            ${{ env.WORK }}/out/build.json
            ${{ env.WORK }}/out/jp-preflight.json
      - name: Preserve validated publication payloads for retry
        if: always() && steps.gates.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: music-data-validated-payload-${{ inputs.region }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ env.WORK }}/out/music-data.json
            ${{ env.WORK }}/out/music-data.json.br
            ${{ env.WORK }}/out/replay
            ${{ env.WORK }}/out/jackets
            ${{ env.WORK }}/out/check.json
            ${{ env.WORK }}/out/build.json

      - name: Disconnect JP VPN
        if: always() && inputs.region == 'jp'
        run: python .github/scripts/jp_vpngate.py stop
