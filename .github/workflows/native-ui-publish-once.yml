name: Native UI JP (immutable one-off publication)

on:
  push:
    branches: [fix/native-ui-jp-publication-20261006]
    paths:
      - .github/workflows/native-ui-publish-once.yml
      - .github/scripts/native_ui_publish.py
      - .github/scripts/native_ui_download.py
      - .github/scripts/test_native_ui_publish.py

# Same-repository draft assets require a token with push access for downloads.
# The bucket identity is still the existing STORY_S3 Secrets, scoped to the last step.
permissions:
  contents: write

concurrency:
  group: native-ui-jp-07ae20b788d94a6db8111f10614db08072f5edc0ac9630087aefa6e51a2e29b6
  cancel-in-progress: false

jobs:
  publish-fixed-closure:
    if: github.repository == 'StarMoe-org/nnnotes' && github.ref == 'refs/heads/fix/native-ui-jp-publication-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Existing S3 SDK only (no native compilation)
        run: python -m pip install --quiet boto3
      - name: Fetch the fixed draft package and check every archive member
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/native_ui_download.py \
            --release-id 403941416 \
            --archive "$RUNNER_TEMP/native-ui-work/native-ui-jp-07ae20b7.zip" \
            --out "$RUNNER_TEMP/native-ui-work/bundle"
      - name: Verify manifest-last behavior, safe resume, and rejection before writes
        run: |
          python .github/scripts/test_native_ui_publish.py \
            --publisher .github/scripts/native_ui_publish.py \
            --bundle "$RUNNER_TEMP/native-ui-work/bundle"
      - name: Read-only preflight of the exact public destination
        run: |
          python .github/scripts/native_ui_publish.py publish \
            --payload "$RUNNER_TEMP/native-ui-work/bundle/encoded-payload" \
            --inventory "$RUNNER_TEMP/native-ui-work/bundle/publication-inventory.json" \
            --report-dir "$RUNNER_TEMP/native-ui-work/reports/preflight" --dry-run
      - name: Publish dependencies, then manifest, with complete public read-back
        env:
          STORY_S3_ACCESS_KEY: ${{ secrets.STORY_S3_ACCESS_KEY }}
          STORY_S3_SECRET_KEY: ${{ secrets.STORY_S3_SECRET_KEY }}
        run: |
          python .github/scripts/native_ui_publish.py publish \
            --payload "$RUNNER_TEMP/native-ui-work/bundle/encoded-payload" \
            --inventory "$RUNNER_TEMP/native-ui-work/bundle/publication-inventory.json" \
            --report-dir "$RUNNER_TEMP/native-ui-work/reports/publication"
      - name: Preserve only public identity and transport reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ui-jp-07ae20b7-reports
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-ui-work/reports/
            ${{ runner.temp }}/native-ui-work/bundle/publication-inventory.json
